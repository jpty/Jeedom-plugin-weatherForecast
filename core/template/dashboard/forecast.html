<div style="flex:0 0 auto;font-size:12px;line-height:normal;text-align:center;min-width:60px;padding:0 2px" class="cmd noRefresh" data-type="info" data-subtype="string" data-cmd_id="#conditionid#">
  <div>#day#</div>
  <div title="#condition#">
    <span style="display:#displayIcon#">
      <i class="#icone#" style="padding-top:3px;font-size:1.8em;line-height:1;height:30px;vertical-align:middle;"></i>
    </span>
    <span style="display:#displayImage#;background:url('#icone#') no-repeat center;background-size:100%;margin:0 auto;width:40px;height:40px;">
    </span>
  </div>
  <div title="Temp. min / max" style="font-size:0.8em">
    <span style="color:#1B9BD3">#low_temperature#°</span> <span style="color:#ED1C24">#high_temperature#°C</span>
  </div>
  <div title="Indice UV" style="font-size:0.8em">
    #uvMax#
  </div>
  <div title="Pluie" style="font-size:0.8em;color:#5688FF">
    #rain#
  </div>
</div>
