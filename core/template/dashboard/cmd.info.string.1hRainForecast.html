<div class="cmd cmd-widget #history#" data-type="info" data-subtype="string" data-template="custom" data-cmd_id="#id#" data-cmd_uid="#uid#" data-version="#version#" data-eqLogic_id="#eqLogic_id#">
  <link rel="stylesheet" type="text/css" href="plugins/weatherForecast/desktop/weather-icons/css/weather-icons.css" />
  <script>
    if (!document.getElementById('WF-rain-css')) {
      const link = document.createElement('link');
      link.id = 'WF-rain-css';
      link.rel = 'stylesheet';
      link.href = 'plugins/weatherForecast/core/template/css/rain-widget.css';
      document.head.appendChild(link);
    }
    // --- Fonction utilitaire pour charger wf-rain.js ---
    function loadWFRain(callback) {
      if (window.WFRain) {
        callback();
        return;
      }

      let script = document.getElementById('wf-rain-js');

      if (!script) {
        script = document.createElement('script');
        script.id = 'wf-rain-js';
        script.src = 'plugins/weatherForecast/core/template/js/wf-rain.js?v=1.0.0';
        script.defer = true;

        script.onload = () => {
          callback();
        };

        document.head.appendChild(script);
      } else {
        // script déjà en cours de chargement → on attend
        script.addEventListener('load', callback);
      }
    }
  </script>
<!-- <link rel="stylesheet" type="text/css" href="plugins/weatherForecast/core/template/css/rain-widget.css" /> -->
  <div class="content">
    <div class="title #hide_name#">
      <div  class="cmdName">#name_display#</div>
    </div>
    <div class="WF-rain-widget">
      <table class="WF-rain-table tableCmd">
        <thead>
          <tr class="time-row"></tr>
        </thead>
        <tbody>
          <tr class="icon-row"></tr>
        </tbody>
      </table>
    </div>
    <div title="Message" class="errorMessage"></div>
  </div>
  <template>
    <div>hideWidgetIfRainNotForecasted: {{Masquer le widget si pas de pluieprévue. 0/1 Défaut: 0}}</div>
    <div>testWidget: {{Test des différents icônes. 0/1 Défaut: 0}}</div>
    <div>useIconFiles: {{Utilisation des fichiers d'icones. 0/1 Défaut: 0}}</div>
    <div>withAnimatedDrops: {{Avec les gouttes d'eau animées. 0/1 Défaut: 1}}</div>
    <div>rainWidgetWidth: {{Largeur du widget. 100%, 400px Défaut: 100%}}</div>
  </template>
  <script>
    jeedom.cmd.addUpdateFunction('#id#',function(_options) {
      if (is_object(cmd = document.querySelector('.cmd[data-cmd_uid="#uid#"]'))) {
        const error = cmd.querySelector('.errorMessage');
        error.innerHTML = '';
// console.log('Widget ' + _options.display_value);
        const widget = cmd.querySelector('.WF-rain-widget');
        widget.classList.remove('WF-variant-img', 'WF-variant-svg');
        if('#useIconFiles#' != '1') { widget.classList.add('WF-variant-svg'); }
        else { widget.classList.add('WF-variant-img'); }
        if ('#'+'rainWidgetWidth#' != '#rainWidgetWidth#') widget.style.width = '#rainWidgetWidth#';

        let forecast = [];
        if('#testWidget#' === '1') { // Build forecast from current time for widget test
          const now = new Date();
          const step = 60 * 1000;
          let currentTime = new Date(Math.floor(now.getTime() / step) * step);
          const periods = [ { duration: 5, intensity: 1 }, { duration: 5, intensity: 2 },
            { duration: 5, intensity: 3 }, { duration: 5, intensity: 4 }, { duration: 5, intensity: 1 },
            { duration: 5, intensity: 2 }, { duration: 10, intensity: 3 },
            { duration: 10, intensity: 3 }, { duration: 10, intensity: 4 }
          ];
          const intensityDescriptions = { 1: "Temps sec", 2: "Pluie fine",
            3: "Pluie modérée", 4: "Pluie forte", 5: "Pluie diluvienne" };
          periods.forEach(period => {
            currentTime = new Date(currentTime.getTime() + period.duration * 60 * 1000);
            forecast.push({
              time: currentTime.toISOString(),
              rain_intensity: period.intensity,
              rain_intensity_description:
                intensityDescriptions[period.intensity]
            });
          });
        }
        else {
          let data;
          const rainData = _options.display_value;
      // console.log('Widget ' +rainData);
          try {
            const json = rainData.replaceAll('&quot;', '"').replaceAll('&#34;', '"');
            data = JSON.parse(json);
            if (!Array.isArray(data?.forecast)) {
              error.innerHTML = "No rain data";
              return;
            }
            forecast = data.forecast;
          } catch (e) {
            error.innerHTML = 'Invalid JSON for rain data ' +e.message;
            return;
          }

          const hasRain = forecast.some(f => f.rain_intensity > 1);
          if('#hideWidgetIfRainNotForecasted#' === '1' && !hasRain) {
            cmd.style.display = 'none';
            return;
          }
        }

        cmd.style.display = '';
        loadWFRain(() => {
          WFRain.render(widget, forecast, {
            useIconFiles: '#useIconFiles#' === '1',
            withAnimatedDrops: '#withAnimatedDrops#' !== '0',
          });
        });
      }
    });
    jeedom.cmd.refreshValue([{cmd_id :'#id#',display_value: '#state#', valueDate: '#valueDate#', collectDate: '#collectDate#', alertLevel: '#alertLevel#', unit: '#unite#'}])
  </script>
</div>
