<div class="cmd noRefresh"
     data-type="info"
     data-subtype="string"
     data-cmd_id="#conditionid#"
     style="flex:0 0 auto;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:flex-start;
            padding:3px 4px;
            font-size:11px;
            line-height:1.2;
            min-width:50px;">

  <!-- Jour -->
  <div style="font-weight:bold;">#day#</div>

  <!-- Icône -->
  <div title="#condition#"
       style="display:flex;align-items:center;justify-content:center;height:32px;">

    <span style="display:#displayIcon#;">
      <i class="#icone#" style="font-size:1.4em;line-height:1"></i>
    </span>

    <span style="display:#displayImage#;background:url('#icone#') no-repeat center;background-size:contain;width:40px;height:40px;">
    </span>

  </div>

  <!-- Temp -->
  <div>#low_temperature#°/#high_temperature#°C</div>

  <!-- Infos secondaires -->
  <div style="display:flex;flex-direction:column;align-items:center;font-size:0.85em;gap:2px;opacity:0.85;">
    <div title="Indice UV">#uvMax#</div>
    <div title="Pluie">#rain#</div>
  </div>

</div>
