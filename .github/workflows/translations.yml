name: translate

# Controls when the workflow will run
on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  auto-translate:
    runs-on: ubuntu-latest
    steps:
      - uses: Mips2648/plugins-translations@v5
        with:
          deepl_api_key: ${{ secrets.DEEPL_API_KEY }}
          target_languages: "en_US,es_ES"
          use_core_translations: false
